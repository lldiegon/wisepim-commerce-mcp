name: Publish MCP Registry metadata
on: workflow_dispatch
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify and run official registry publisher
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz -o publisher.tgz
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  publisher.tgz" | sha256sum -c -
          tar xzf publisher.tgz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
